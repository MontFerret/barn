name: Stamp publication timestamps

on:
  push:
    branches:
      - main
    paths:
      - 'registry/modules/*/*/versions/*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stamp-publications-main
  cancel-in-progress: false

jobs:
  stamp:
    name: Stamp unstamped versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Capture publication base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp unpublished versions
        run: make stamp

      - name: Detect canonical source changes
        id: changes
        run: |
          if git diff --quiet -- registry/modules; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate publication transition
        if: steps.changes.outputs.changed == 'true'
        run: |
          make check-stamped
          make check-immutable BASE='${{ steps.base.outputs.sha }}'

      - name: Generate Barn Publisher token
        id: barn-publisher
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BARN_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.BARN_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write

      - name: Resolve Barn Publisher identity
        id: barn-publisher-identity
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.barn-publisher.outputs.token }}
          PUBLISHER_SLUG: ${{ steps.barn-publisher.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${PUBLISHER_SLUG}[bot]" --jq '.id')
          echo "user-id=$user_id" >> "$GITHUB_OUTPUT"

      - name: Commit publication timestamps
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name '${{ steps.barn-publisher.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.barn-publisher-identity.outputs.user-id }}+${{ steps.barn-publisher.outputs.app-slug }}[bot]@users.noreply.github.com'
          git add -- registry/modules
          git commit -m 'Stamp published module versions'

      - name: Push publication timestamps
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.barn-publisher.outputs.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:main

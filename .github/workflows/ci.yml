name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Check module metadata
        run: make mod-check

      - name: Test
        run: make test

      - name: Race test
        run: make test-race

      - name: Check immutable published state against PR base
        if: github.event_name == 'pull_request'
        run: make check-immutable BASE='${{ github.event.pull_request.base.sha }}'

      - name: Check immutable published state on main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: make check-immutable BASE='${{ github.event.before }}'

      - name: Validate registry sources
        run: make validate

      - name: Verify generated catalog
        run: make verify

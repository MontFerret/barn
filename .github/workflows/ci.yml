name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Check module metadata
        run: make mod-check

      - name: Test
        run: make test

      - name: Race test
        run: make test-race

      - name: Check immutable published state against PR base
        if: github.event_name == 'pull_request'
        run: make check-immutable BASE='${{ github.event.pull_request.base.sha }}'

      - name: Check immutable published state on main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: make check-immutable BASE='${{ github.event.before }}'

      - name: Generate distribution
        run: make generate

      - name: Verify deterministic distribution
        run: make verify

  deploy:
    name: Deploy distribution
    if: github.ref == 'refs/heads/main'
    needs:
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate distribution
        run: make generate

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  repository_dispatch:
    types:
      - publication-stamped
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate registry
    runs-on: ubuntu-latest
    outputs:
      publication-ready: ${{ steps.publication.outputs.ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Check module metadata
        run: make mod-check

      - name: Test
        run: make test

      - name: Race test
        run: make test-race

      - name: Check immutable published state against PR base
        if: github.event_name == 'pull_request'
        run: make check-immutable BASE='${{ github.event.pull_request.base.sha }}'

      - name: Check immutable published state on main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: make check-immutable BASE='${{ github.event.before }}'

      - name: Check publication stamp transition
        if: github.event_name == 'repository_dispatch'
        run: make check-immutable BASE='${{ github.event.client_payload.base }}'

      - name: Check publication completeness
        id: publication
        run: |
          if make check-stamped; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp pull request preview
        if: github.event_name == 'pull_request' && steps.publication.outputs.ready != 'true'
        run: make stamp STAMP_TIMESTAMP='2000-01-01T00:00:00Z'

      - name: Generate distribution
        if: github.event_name == 'pull_request' || steps.publication.outputs.ready == 'true'
        run: make generate

      - name: Verify deterministic distribution
        if: github.event_name == 'pull_request' || steps.publication.outputs.ready == 'true'
        run: make verify

  deploy:
    name: Deploy distribution
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.publication-ready == 'true'
    needs:
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate distribution
        run: make generate

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
